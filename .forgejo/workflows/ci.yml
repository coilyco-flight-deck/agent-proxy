# Forgejo-canonical CI gate (agent-proxy#31). Runs the declared dev tooling off
# pyproject.toml so every landing is gated on the same checks a contributor runs
# locally: pytest, ruff, black --check, mypy, plus the two daemonless boot/import
# smoke scripts.
#
# Why raw `uv run` and not `ward <verb>`: the `docker` runner ships no flight-deck
# tooling on PATH (it is a stock image, same as cli-guard's and infrastructure's
# gates), so the ward binary is not available here. ward.yaml stays the local
# source of truth - it maps these same commands (`ward test`, `ward smoke`,
# `ward boot-probe`) - and CI invokes the underlying commands directly through
# `astral-sh/setup-uv`, matching infrastructure/lint.yml's convention. uv
# provisions its own Python from the `requires-python` floor, so no setup-python
# step is needed.
#
# Deliberately NOT in this gate: test-container.sh (needs a Docker daemon) and the
# tower-dependent scripts/truncation_proof.py + scripts/reliability_loop.py (need
# the tower reachable). Both would break a daemonless, tower-less runner. Only the
# daemonless paths run here.
#
# Assumes this Forgejo instance has an Actions runner labelled `docker` for the
# repo; if it does not yet, this workflow is still the correct artifact and starts
# gating as soon as one is attached (agent-proxy#31).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Tests (ward test)
        run: uv run pytest
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Types (mypy)
        run: uv run mypy app

  smoke:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Daemonless boot probe (ward boot-probe)
        run: ./boot_probe.sh
      - name: Import/build smoke (ward smoke)
        run: ./test-fixes.sh
